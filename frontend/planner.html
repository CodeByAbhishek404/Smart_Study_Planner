<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Smart Study Planner</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css?v=1.2">
    <link rel="stylesheet" href="css/planner.css?v=1.2">
    <link rel="stylesheet" href="css/responsive.css?v=1.2">
    <script src="js/theme.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar placeholder -->
        <div id="sidebar-placeholder"></div>
        <div class="sidebar-overlay" onclick="toggleSidebarMenu()"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Navbar placeholder -->
            <div id="navbar-placeholder"></div>

            <!-- Page Title Header -->
            <div class="planner-header">
                <div class="page-title-header" style="margin-bottom: 0;">
                    <h1>Smart Timetable Generator</h1>
                    <p>Generate and view customized study sessions matching your load.</p>
                </div>
                
                <!-- Date selector navigations -->
                <div class="date-controls glass-panel" style="padding: 6px 12px;">
                    <button class="date-btn" onclick="adjustPlanDate(-1)"><i class="fas fa-chevron-left"></i></button>
                    <span id="current-plan-date-display" class="current-date-display">Today</span>
                    <button class="date-btn" onclick="adjustPlanDate(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- Schedule Auto-Generator Form -->
            <div class="glass-card generator-card">
                <h3 style="font-size: 1.2rem; margin-bottom: 15px;"><i class="fas fa-magic" style="color: var(--primary); margin-right: 8px;"></i> Generate New Study Plan</h3>
                <form id="schedule-generator-form">
                    <div class="generator-form">
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="startDate" class="input-label">Start Date</label>
                            <input type="date" id="startDate" class="input-field" required>
                        </div>
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="endDate" class="input-label">End Date</label>
                            <input type="date" id="endDate" class="input-field" required>
                        </div>
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="dailyStudyHours" class="input-label">Daily Hours (Optional)</label>
                            <input type="number" id="dailyStudyHours" class="input-field" placeholder="e.g. 4" min="1" max="12" step="0.5">
                        </div>
                        <button type="submit" class="btn-primary" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-heading);">
                            <i class="fas fa-cog fa-spin" id="gen-spinner" style="display: none;"></i>
                            <span>Generate Schedule</span>
                        </button>
                    </div>
                    <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="distributeEqually" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary);">
                        <label for="distributeEqually" style="font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; user-select: none;">
                            Divide daily study time equally to cover all subjects
                        </label>
                    </div>
                </form>
                <div id="generator-alert" class="alert alert-success" style="margin-top: 15px; margin-bottom: 0; display: none;">
                    <i class="fas fa-check-circle"></i>
                    <span>Plan generated successfully!</span>
                </div>
            </div>

            <!-- Timetable List -->
            <div class="glass-card">
                <h3 style="font-size: 1.2rem; margin-bottom: 20px;"><i class="far fa-clock" style="color: var(--info); margin-right: 8px;"></i> Study Schedule Timeline</h3>
                <div id="planner-timeline" class="timeline-container">
                    <!-- Dynamic timetable blocks injected by planner.js -->
                    <div class="empty-timeline">
                        <i class="far fa-calendar-alt"></i>
                        <h3>No Study Slots Scheduled</h3>
                        <p>Generate a plan using the form above to build your study timeline.</p>
                    </div>
                </div>
            </div>

            <!-- Footer placeholder -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- Modal placeholder -->
    <div id="modal-placeholder"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/particles.js"></script>
</body>
</html>
